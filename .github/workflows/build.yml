# Builds the Shruthi-1 firmware (.hex + .syx for the MIDI bootloader) on every push.
name: build
on: [push, pull_request, workflow_dispatch]
jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      # Ubuntu 12.04 = avr-gcc 4.5.3; newer avr-gcc crashes on avrlib's prog_char (original used 4.3).
      - name: Build in Ubuntu 12.04
        run: |
          docker run --rm -v "$PWD:/src" -w /src ubuntu:12.04 bash -ec '
            sed -i "s#http://archive.ubuntu.com#http://old-releases.ubuntu.com#; s#http://security.ubuntu.com#http://old-releases.ubuntu.com#" /etc/apt/sources.list
            apt-get update -qq && apt-get install -y -qq gcc-avr avr-libc binutils-avr make python >/dev/null
            avr-gcc --version | head -1
            make -f shruthi/makefile AVRLIB_TOOLS_PATH=/usr/bin/
            make -f shruthi/makefile AVRLIB_TOOLS_PATH=/usr/bin/ syx
            avr-size build/shruthi1/shruthi1.elf > build/shruthi1/size.txt'
      - name: Size (must stay below bootloader at 0xFC00 = 64512 B)
        run: |
          cat build/shruthi1/size.txt | tee -a "$GITHUB_STEP_SUMMARY"
          used=$(awk 'NR==2{print $1+$2}' build/shruthi1/size.txt)
          echo "flash used: $used / 64512" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$used" -le 64512
      - uses: actions/upload-artifact@v4
        with:
          name: shruthi1-firmware
          path: |
            build/shruthi1/shruthi1.hex
            build/shruthi1/shruthi1.syx
